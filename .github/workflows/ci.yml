name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -b
      - run: npx vitest run --coverage
      - run: npx playwright test
      - run: npm run build
      - name: Report the coverage of the changed lines
        if: github.event_name == 'pull_request'
        run: node scripts/coverage-patch.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
