name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep the coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info

  coverage-status:
    # Only this job can write a commit status; it installs and runs no package.
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lcov
          path: coverage
      - name: Report coverage of the changed lines
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          # The least share of changed lines that must run under a test.
          MIN_PERCENT: 80
        run: |
          description="$(node scripts/patch-coverage.mjs "$BASE_SHA")"
          echo "$description"
          percent="${description%%%*}"
          if [ "$percent" -ge "$MIN_PERCENT" ]; then state=success; else state=failure; fi
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=coverage/patch \
            -f description="$description"
