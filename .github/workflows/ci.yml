name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npm run test:e2e
      - name: Report coverage of the changed lines
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          description="$(node scripts/patch-coverage.mjs "$BASE_SHA")"
          echo "$description"
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success \
            -f context=coverage/patch \
            -f description="$description"
